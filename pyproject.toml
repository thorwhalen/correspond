[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "correspond"
version = "0.0.8"
description = "A channel facade for AI agents: read, listen, write and identify the sender over GitHub, email, push notifications, Telegram and a web inbox."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["channels", "messaging", "notifications", "github", "email", "telegram", "ntfy", "agents", "claude-code"]
authors = [
    { name = "Thor Whalen" },
]
# `xdol` provides the channel registry; `dol` the file stores under the data root (both
# imported on first use, not at `import correspond`); `cw` builds the CLI from the same
# functions `correspond.tools` exposes (imported only by `__main__`). Every v0.1 adapter
# uses the standard library alone.
dependencies = [
    "cw>=0.1.1,<0.2",
    "dol",
    "xdol",
]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/correspond"
Repository = "https://github.com/thorwhalen/correspond"
Documentation = "https://thorwhalen.github.io/correspond"
Issues = "https://github.com/thorwhalen/correspond/issues"

[project.scripts]
correspond = "correspond.__main__:main"
correspond-mcp = "correspond.mcp:main"

[project.optional-dependencies]
# MCP over stdio is an optional surface, so its dependency is an extra.
mcp = [
    "py2mcp",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["correspond"]

# An allowlist, never a denylist: `.claude/skills/<name>` will be a symlink into
# `correspond/data/skills/`, and an sdist is a copy of whatever it includes.
[tool.hatch.build.targets.sdist]
only-include = ["correspond", "tests", ".github", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
    "correspond",
]
addopts = "--doctest-modules"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "correspond"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.11",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.11"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
